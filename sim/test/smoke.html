<!doctype html>
<!-- Browser smoke test: loads the simulator in an iframe, renders + exports
     every animation, and reports in #result; the last line is SMOKE OK or SMOKE FAIL.
     Run test/smoke.sh, or open http://localhost:<port>/test/smoke.html with a server on sim/. -->
<meta charset="utf-8">
<title>sim smoke test</title>
<pre id="result">running…</pre>
<iframe id="f" src="../index.html" width="1200" height="800"></iframe>
<script>
const out = [];
const f = document.getElementById('f');
const sleep = ms => new Promise(r => setTimeout(r, ms));
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  // the list is built once every animation file has loaded
  for (let i = 0; i < 600 && !d.querySelectorAll('#anim-list li.item').length; i++) await sleep(100);
  const items = [...d.querySelectorAll('#anim-list li.item')];
  const problems = [];
  const registered = w.SimApp ? w.SimApp.registry.length : 0;
  out.push(`animations: ${items.length}`);
  if (!items.length) problems.push('no animations in the list');
  else if (items.length !== registered) problems.push(`the list shows ${items.length} of ${registered} registered animations`);
  for (const li of items) {
    li.click();
    await sleep(300);
    d.getElementById('btn-size').click();
    for (let i = 0; i < 300 && !d.getElementById('hud-size').textContent; i++) await sleep(100);
    if (!d.getElementById('hud-size').textContent) problems.push(`${li.dataset.name}: export did not finish in 30 s`);
    const px = d.getElementById('screen').getContext('2d').getImageData(0, 0, 240, 240).data;
    let lit = 0; for (let k = 0; k < px.length; k += 4) if (px[k] | px[k + 1] | px[k + 2]) lit++;
    out.push(`${li.dataset.name}: frame ${d.getElementById('hud-frame').textContent}, export ${d.getElementById('hud-size').textContent}, lit pixels ${lit}`);
  }
  const errs = [...d.querySelectorAll('#log .err')].map(e => e.textContent).concat(problems);
  out.push(`errors: ${errs.length}` + (errs.length ? '\n  ' + errs.join('\n  ') : ''));
  out.push(errs.length ? 'SMOKE FAIL' : 'SMOKE OK');
  document.getElementById('result').textContent = out.join('\n');
};
</script>
