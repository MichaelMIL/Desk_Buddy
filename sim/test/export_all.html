<!doctype html>
<!-- Exports every animation into the firmware directory via serve.py's
     /api/export (test/export_all.sh), or with ?push=<board address> uploads
     them all to a running desk buddy over Wi-Fi (test/push_all.sh), or with
     ?library=1 saves them all in the local library (test/library.sh). -->
<meta charset="utf-8">
<title>export all</title>
<pre id="result">running…</pre>
<iframe id="f" src="../index.html" width="1200" height="800" style="position:absolute;left:-3000px"></iframe>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
document.getElementById('f').onload = async () => {
  const w = document.getElementById('f').contentWindow;
  const out = [];
  // wait until every animation file has loaded: the list is built once, after the last one
  // (the registry fills file by file, so waiting for it to be non-empty exported only the first few)
  for (let i = 0; i < 600 && !w.document.querySelector('#anim-list li.item'); i++) await sleep(100);
  if (!w.document.querySelector('#anim-list li.item')) {
    document.getElementById('result').textContent = 'EXPORT FAIL: the simulator did not finish loading its animations';
    return;
  }
  const skip = /^(Template)$/;
  const params = new URLSearchParams(location.search);
  const host = params.get('push');
  const filter = params.get('filter') ? new RegExp(params.get('filter')) : null;
  if (host) { w.document.getElementById('board-host').value = host; w.document.getElementById('chk-board-play').checked = false; }
  for (const a of [...w.SimApp.registry]) {
    if (skip.test(a.name) || (filter && !filter.test(a.name))) continue;
    if (params.get('library')) {
      const j = await w.SimApp.exportToLibrary(a);
      out.push(j ? `${a.name}: ${(j.bytes / 1024).toFixed(1)} KB -> library/${j.name}` : `${a.name}: FAILED`);
    } else if (host) {
      const j = await w.SimApp.pushToBoard(a);
      out.push(j ? `${a.name}: stored on ${host} (${j.free_kb} KB free)` : `${a.name}: FAILED`);
    } else {
      const j = await w.SimApp.exportToFirmware(a);
      out.push(j ? `${a.name}: ${(j.bytes / 1024).toFixed(1)} KB -> ${j.file.split('/').pop()}` : `${a.name}: FAILED`);
    }
  }
  out.push(out.some(l => l.endsWith('FAILED')) ? 'EXPORT FAIL' : 'EXPORT OK');
  document.getElementById('result').textContent = out.join('\n');
};
</script>
