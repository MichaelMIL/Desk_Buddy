<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Buddy firmware</title>
<!-- Build page, served by firmware.py (python3 tools/firmware/firmware.py); the settings come from options.json. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="buddy" aria-hidden="true"><span class="eye"></span><span class="eye"></span><span class="mouth"></span><span class="cheeks"></span></div>
  <div class="title"><h1>Desk Buddy <em>firmware</em></h1><span class="sub" id="sub">loading…</span></div>
  <nav class="tabs"><a href="index.html" class="on">Build</a><a href="flash.html">Flash</a><a href="wiring.html">Wiring</a></nav>
</header>
<main>
  <div>
    <section class="card">
      <h2>Settings</h2>
      <div id="opts"></div>
    </section>
    <section class="card">
      <h2>Build</h2>
      <dl>
        <dt>Base</dt><dd class="mono" id="p-env">–</dd>
        <dt>Flags</dt><dd class="mono" id="p-flags">–</dd>
        <dt>Output</dt><dd class="mono" id="p-out">–</dd>
      </dl>
      <div class="cmd mono" id="p-cmd"></div>
      <div id="p-msgs"></div>
    </section>
    <section class="card">
      <h2>After the build</h2>
      <div class="modes">
        <div class="mode">
          <input type="radio" name="mode" value="none" id="m-none" checked><label for="m-none">Only build: the file goes to <code id="outdir">out/</code></label>
        </div>
        <div class="mode" id="mode-usb">
          <input type="radio" name="mode" value="usb" id="m-usb"><label for="m-usb">Flash over USB with PlatformIO</label>
          <div class="extra"><select id="port" aria-label="USB port"><option value="">any port (auto)</option></select><button class="small" id="refresh" type="button">Refresh</button></div>
        </div>
        <div class="mode" id="mode-ota">
          <input type="radio" name="mode" value="ota" id="m-ota"><label for="m-ota">Update over Wi-Fi</label>
          <div class="extra"><input type="text" id="host" placeholder="address, e.g. desk-buddy.local" aria-label="Buddy address"><input type="password" id="otapw" placeholder="update password (if set)" aria-label="Update password"></div>
        </div>
      </div>
      <div id="u-notes"></div>
      <div class="actions">
        <button class="primary" id="go" type="button" disabled>Build</button>
        <button id="stop" type="button" class="hidden">Stop</button>
      </div>
    </section>
  </div>
  <section class="card logcard">
    <div class="loghead"><h2>Output</h2><span class="status" id="status">idle</span><span class="sub" id="jobname"></span></div>
    <pre id="log"></pre>
    <div class="result" id="result"></div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  let token = q.get('t') || '';
  try { if (token) sessionStorage.setItem('fwb-token', token); else token = sessionStorage.getItem('fwb-token') || ''; } catch (e) {}
  if (q.get('t')) history.replaceState(null, '', location.pathname);

  const store = {
    get(k, d) { try { const v = localStorage.getItem('fwb-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('fwb-' + k, JSON.stringify(v)); } catch (e) {} },
  };

  async function api(path, body) {
    const r = await fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'X-Token': token, ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  let doc = null, values = {}, cur = null, polling = false, since = 0;
  const ctls = {};   // option id -> { o, input, note }

  function el(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
    }
    for (const k of kids) if (k) e.append(k);
    return e;
  }

  function renderOptions() {
    const box = $('opts');
    box.textContent = '';
    for (const o of doc.options) {
      const id = 'o-' + o.id;
      let ctl;
      if (o.type === 'bool') {
        const inp = el('input', { type: 'checkbox', id, role: 'switch' });
        inp.checked = !!values[o.id];
        inp.disabled = !o.supported;
        inp.addEventListener('change', () => { values[o.id] = inp.checked; changed(); });
        ctl = el('span', { class: 'switch' }, inp, el('span'));
        ctl.input = inp;
      } else if (o.type === 'choice') {
        ctl = el('select', { id });
        for (const c of o.choices) ctl.append(el('option', { value: String(c.value), text: c.label || String(c.value) }));
        ctl.value = String(values[o.id]);
        ctl.disabled = !o.supported;
        ctl.addEventListener('change', () => { values[o.id] = o.choices.find(c => String(c.value) === ctl.value).value; changed(); });
      } else if (o.type === 'number') {
        ctl = el('input', { type: 'number', id, ...(o.min != null ? { min: o.min } : {}), ...(o.max != null ? { max: o.max } : {}) });
        ctl.value = values[o.id];
        ctl.disabled = !o.supported;
        ctl.addEventListener('change', () => { values[o.id] = Number(ctl.value); changed(); });
      }
      const name = el('label', { class: 'name', for: id, text: o.label });
      if (!o.supported) name.append(el('span', { class: 'badge', text: 'needs firmware support' }));
      const note = el('span', { class: 'badge hidden' });
      name.append(note);
      ctls[o.id] = { o, input: ctl.input || ctl, note };
      box.append(el('div', { class: 'opt' }, name, ctl, o.help ? el('div', { class: 'help', text: o.help }) : null));
    }
  }

  /* Options another one forces (e.g. "USB serial only" turns Wi-Fi and Bluetooth off):
     show the forced value, greyed out; the user's own choice comes back when it is released. */
  function applyForced() {
    const forced = (cur && cur.forced) || {};
    for (const [id, { o, input, note }] of Object.entries(ctls)) {
      const by = forced[id], v = by ? cur.values[id] : values[id];
      if (o.type === 'bool') input.checked = !!v; else input.value = String(v);
      input.disabled = !o.supported || !!by;
      note.textContent = by ? 'set by ' + by : '';
      note.classList.toggle('hidden', !by);
    }
  }

  function mode() { return document.querySelector('input[name=mode]:checked').value; }
  function upload() {
    const m = mode();
    if (m === 'usb') return { type: 'usb', port: $('port').value || null };
    if (m === 'ota') return { type: 'ota', host: $('host').value.trim(), password: $('otapw').value };
    return null;
  }

  let seq = 0;
  async function changed() {
    store.set('values', values);
    store.set('mode', mode());
    store.set('host', $('host').value.trim());
    const mine = ++seq;
    let res;
    try { res = await api('/api/plan', { values, upload: upload() }); } catch (e) { res = { errors: [e.message], warnings: [], flags: [] }; }
    if (mine !== seq) return;                    // a newer change is on its way: drop this answer
    cur = res;
    $('p-env').textContent = cur.env || '–';
    $('p-flags').textContent = (cur.flags || []).join(' ') || '(none)';
    $('p-out').textContent = cur.name ? doc.out_dir + '/' + cur.name + '.bin' : '–';
    $('p-cmd').textContent = cur.command ? (cur.flags.length ? 'PLATFORMIO_BUILD_FLAGS="' + cur.flags.join(' ') + '" ' : '') + cur.command : '';
    applyForced();
    const msgs = $('p-msgs');
    msgs.textContent = '';
    for (const w of cur.warnings || []) msgs.append(el('div', { class: 'msg warn', text: w }));
    for (const e of cur.errors || []) msgs.append(el('div', { class: 'msg err', text: e }));
    // Wi-Fi updates only for Wi-Fi builds
    const ota = !!cur.wifi_build;
    $('mode-ota').classList.toggle('disabled', !ota);
    $('m-ota').disabled = !ota;
    if (!ota && mode() === 'ota') { document.querySelector('input[name=mode][value=none]').checked = true; }
    const notes = $('u-notes');
    notes.textContent = '';
    if (mode() !== 'none') for (const n of cur.upload_notes || []) notes.append(el('div', { class: 'msg note', text: n }));
    updateButtons();
  }

  function updateButtons(running = polling) {
    const m = mode();
    $('go').textContent = m === 'usb' ? 'Build and flash' : m === 'ota' ? 'Build and update' : 'Build';
    const bad = !cur || (cur.errors || []).length > 0 || !doc.pio || (m === 'ota' && !$('host').value.trim());
    $('go').disabled = running || bad;
    $('stop').classList.toggle('hidden', !running);
  }

  async function loadPorts() {
    const sel = $('port'), keep = sel.value || store.get('port', '');
    $('refresh').disabled = true;
    try {
      const { ports } = await api('/api/ports');
      sel.textContent = '';
      sel.append(el('option', { value: '', text: 'any port (auto)' }));
      for (const p of ports) sel.append(el('option', { value: p.port, text: p.port + (p.description && p.description !== 'n/a' ? '  ' + p.description : '') }));
      if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
      else if (ports.length) sel.value = ports[0].port;
    } catch (e) { /* keep the list */ }
    $('refresh').disabled = false;
  }

  function setStatus(s) { const st = $('status'); st.textContent = s; st.className = 'status ' + s; }

  function kb(n) { return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB'; }
  function bar(label, r) {
    const fill = el('div', { class: 'fill' + (r.pct >= 97 ? ' red' : r.pct >= 90 ? ' amber' : '') });
    fill.style.width = Math.min(100, r.pct) + '%';
    return el('div', { class: 'bar' }, el('span', { text: label }), el('div', { class: 'track' }, fill),
      el('span', { class: 'mono', text: r.pct.toFixed(1) + '%  ' + kb(r.used) + ' / ' + kb(r.total) }));
  }
  function renderResult(j) {
    const box = $('result');
    box.textContent = '';
    const r = j.result || {};
    if (r.flash) box.append(bar('Flash', r.flash));
    if (r.ram) box.append(bar('RAM', r.ram));
    if (r.bin) box.append(el('div', { class: 'msg note' }, 'App: ', el('code', { text: r.bin }), ' (' + kb(r.bytes) + ')'));
    if (r.factory) box.append(el('div', { class: 'msg note' }, 'Full image: ', el('code', { text: r.factory }), ' (' + kb(r.factory_bytes) + ')'));
    if (r.factory && j.status === 'ok' && !r.uploaded)
      box.append(el('div', {}, el('a', { class: 'button', href: 'flash.html?build=' + encodeURIComponent(r.name), text: 'Flash it in this browser' })));
    if (r.uploaded === 'usb') box.append(el('div', { class: 'msg note', text: 'Flashed over USB. The buddy restarts; give it a few seconds.' }));
    if (r.uploaded === 'ota') box.append(el('div', { class: 'msg note', text: 'Sent over Wi-Fi. The buddy installs it and restarts.' }));
  }

  async function poll() {
    if (polling) return;
    polling = true;
    updateButtons(true);
    const log = $('log');
    while (true) {
      let j;
      try { j = await api('/api/job?since=' + since); } catch (e) { await new Promise(r => setTimeout(r, 1000)); continue; }
      if (j.lines.length) {
        const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
        log.append(j.lines.join('\n') + '\n');
        if (atEnd) log.scrollTop = log.scrollHeight;
      }
      since = j.next;
      setStatus(j.status);
      $('jobname').textContent = j.name || '';
      renderResult(j);
      if (j.status !== 'running') break;
      await new Promise(r => setTimeout(r, 400));
    }
    polling = false;
    updateButtons(false);
  }

  $('go').addEventListener('click', async () => {
    if (!cur || cur.errors.length) return;
    $('log').textContent = '';
    $('result').textContent = '';
    since = 0;
    try {
      await api('/api/build', { values, upload: upload() });
      if (mode() === 'usb') store.set('port', $('port').value);
      poll();
    } catch (e) {
      setStatus('failed');
      $('log').textContent = 'error: ' + e.message + '\n';
    }
  });
  $('stop').addEventListener('click', () => api('/api/stop', {}).catch(() => {}));
  $('refresh').addEventListener('click', loadPorts);
  for (const r of document.querySelectorAll('input[name=mode]')) r.addEventListener('change', changed);
  $('host').addEventListener('input', () => { store.set('host', $('host').value.trim()); updateButtons(); });
  $('host').addEventListener('change', changed);

  (async () => {
    if (!token) { $('sub').textContent = 'Open this page from the address firmware.py prints (it carries the access token).'; return; }
    let info;
    try { info = await api('/api/options'); } catch (e) { $('sub').textContent = 'Cannot reach firmware.py: ' + e.message; return; }
    doc = { ...info.doc, out_dir: info.out_dir, pio: info.pio };
    $('outdir').textContent = info.out_dir + '/';
    $('sub').textContent = 'firmware ' + info.version + (info.pio ? '' : ' · PlatformIO (pio) not found: install it to build');
    const saved = store.get('values', {});
    for (const o of doc.options) {
      const v = saved[o.id];
      const ok = o.supported && (o.type === 'bool' ? typeof v === 'boolean'
        : o.type === 'choice' ? o.choices.some(c => c.value === v)
        : typeof v === 'number' && (o.min == null || v >= o.min) && (o.max == null || v <= o.max));
      values[o.id] = ok ? v : o.default;
    }
    $('host').value = store.get('host', '');
    const m = store.get('mode', 'none');
    const r = document.querySelector('input[name=mode][value="' + m + '"]');
    if (r) r.checked = true;
    renderOptions();
    await changed();
    loadPorts();
    const j = await api('/api/job').catch(() => null);
    if (j && j.status !== 'idle') poll();
  })();
})();
</script>
</body>
</html>
