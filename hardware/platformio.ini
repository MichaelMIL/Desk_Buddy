; Desk buddy firmware: ESP32-S3 SuperMini + 1.28" round GC9A01 TFT (240x240).
;
; The SuperMini has no board definition of its own; lolin_s3_mini is the same
; chip (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM, native USB) and works as-is.
;
; Two builds (README.md "Two builds"):
;   pio run -t upload                          Wi-Fi build: Bluetooth, MQTT, HTTP API, OTA
;   pio run -e esp32s3_supermini_ble -t upload  without Wi-Fi: Bluetooth + USB, 3.3 MB for animations
;   pio device monitor                         serial console (115200): "status", "list", "play <name>", ...
; (hold BOOT, tap RESET if the port is not found)
;
; No web pages on the device: control over Bluetooth (BLE.md, pairing code on
; the screen), MQTT, USB serial, or the HTTP API (API.md). First Wi-Fi setup:
; "wifi <ssid> <pass>" over Bluetooth or serial, or POST /api/config on the
; setup access point DeskBuddy-xxxxxx (192.168.4.1).
;
; Animations are uploaded at run time (sim "-> board", sim/test/push_all.sh
; <address|usb|ble>) and live on LittleFS. Compiled-in ones are still possible
; (src/animations/, written by the sim's "-> firmware") but eat into the app slot.

[platformio]
default_envs = esp32s3_supermini

; Over-the-air update once the buddy is on Wi-Fi (or hardware/ota.sh, PUT /api/update):
;   pio run -e ota -t upload --upload-port 192.168.50.99   (or desk-buddy.local)
; add --upload-flags --auth=<password> if a firmware update password is set.

[env:esp32s3_supermini]
platform = platformio/espressif32@^6.12.0
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; two 1 MB app slots (OTA) + 1.875 MB LittleFS for uploaded animations, see partitions.csv
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; slim.py: printf from the chip ROM (newlib-nano) and no ESP Insights log hooks.
; See the size notes in README.md.
extra_scripts = post:slim.py
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
    ; exact version: the NimBLE flags below are checked against 1.4.3
    h2zero/NimBLE-Arduino@1.4.3
; nothing catches C++ exceptions here (an uncaught one aborts either way), so
; drop the unwind tables: ~50 KB of flash
build_unflags = -fexceptions
build_flags =
    -fno-exceptions
    -fno-unwind-tables
    -fno-asynchronous-unwind-tables
    ; --- NimBLE: peripheral only, one connection; pairing = LE Secure Connections
    ;     only (legacy pairing, whose passkey can be cracked from a capture, is not
    ;     compiled in); bonds persist in NVS (default) ---
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DMYNEWT_VAL_BLE_SM_LEGACY=0
    -DMYNEWT_VAL_BLE_SM_SC=1
    ; native USB serial on the SuperMini
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; --- TFT_eSPI setup (instead of editing User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DUSE_FSPI_PORT=1  ; ESP32-S3: use SPI2 (FSPI). Without this TFT_eSPI picks port 0 and crashes at boot
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=11      ; module pin SDA
    -DTFT_SCLK=12      ; module pin SCL
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=-1        ; backlight is hard-wired on this module
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_FONT2=1     ; small text (messages); font 1 (GLCD) is not used
    -DLOAD_FONT4=1     ; large digits (loading percentage)
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    '-DFW_VERSION="${this.__fw_version}"'
__fw_version = 2026.11.13a

[env:ota]
extends = env:esp32s3_supermini
upload_protocol = espota
upload_port = desk-buddy.local

; Build without Wi-Fi: Bluetooth + USB serial only (no MQTT, HTTP API or OTA;
; firmware updates over USB). One app slot instead of two OTA slots, so the
; file system gets the freed flash (partitions_ble.csv). Switching between this
; and the Wi-Fi build changes the partition table and erases stored animations.
;   pio run -e esp32s3_supermini_ble -t upload
[env:esp32s3_supermini_ble]
extends = env:esp32s3_supermini
board_build.partitions = partitions_ble.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@1.4.3
lib_ldf_mode = chain+   ; evaluate #if BUDDY_WIFI so the Wi-Fi libraries are not even compiled
build_flags =
    ${env:esp32s3_supermini.build_flags}
    -DBUDDY_WIFI=0
