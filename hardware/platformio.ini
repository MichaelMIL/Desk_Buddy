; Desk buddy firmware: ESP32-S3 SuperMini + 1.28" round GC9A01 TFT (240x240).
;
; The SuperMini has no board definition of its own; lolin_s3_mini is the same
; chip (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM, native USB) and works as-is.
;
;   pio run -t upload        build + flash (hold BOOT, tap RESET if the port is not found)
;   pio device monitor       serial console (115200): "status", "list", "play <name>", "wifi <ssid> <pass>", ...
;
; First boot (no Wi-Fi saved): join the open AP "DeskBuddy-xxxxxx" and open
; http://192.168.4.1/ to pick a face and enter Wi-Fi / MQTT settings. Once on
; your network the same page is at http://deskbuddy.local/.
;
; Animations live in src/animations/ (anim_*.h + generated animations.h). The
; simulator writes them there with its "→ firmware" button, or use
;   python3 ../sim/tools/dba.py encode frames/*.png -o src/animations/anim_x.h
;   python3 ../sim/tools/gen_registry.py src/animations

[platformio]
default_envs = esp32s3_supermini

; Over-the-air update once the buddy is on Wi-Fi (also: Settings page > Firmware, or hardware/ota.sh):
;   pio run -e ota -t upload --upload-port 192.168.50.99   (or desk-buddy.local)
; add --upload-flags --auth=<password> if a firmware update password is set.

[env:esp32s3_supermini]
platform = platformio/espressif32@^6.12.0
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; two 1 MB app slots (OTA) + 1.875 MB LittleFS for uploaded animations, see partitions.csv
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
build_flags =
    ; native USB serial on the SuperMini
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; --- TFT_eSPI setup (instead of editing User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    -DUSE_FSPI_PORT=1  ; ESP32-S3: use SPI2 (FSPI). Without this TFT_eSPI picks port 0 and crashes at boot
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=11      ; module pin SDA
    -DTFT_SCLK=12      ; module pin SCL
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_BL=-1        ; backlight is hard-wired on this module
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1     ; small text (messages)
    -DLOAD_FONT4=1     ; large digits (loading percentage)
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    '-DFW_VERSION="${this.__fw_version}"'
__fw_version = 2026.11.12b

[env:ota]
extends = env:esp32s3_supermini
upload_protocol = espota
upload_port = desk-buddy.local
